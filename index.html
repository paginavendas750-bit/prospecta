const providers={osm:{name:'OpenStreetMap (Overpass)',async search(q,prog){

 const mk=(hd,fl,t)=>{const L=[];q.niches.forEach(n=>n.e.forEach(([k,re,nm])=>L.push('nwr["'+k+'"~"'+re+'"'+(k=='name'?',i':'')+']'+(nm?'["name"~"'+nm+'",i]':'')+(k=='name'?'':'["name"]')+fl+';')));return'[out:json][timeout:'+t+'];'+hd+'('+L.join('')+');out center tags 300;'};
 const EP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
 let bb=null;if(hit&&hit.boundingbox){const[s,n,w,e]=hit.boundingbox;bb='('+s+','+w+','+n+','+e+')'}
 const at=[];if(head)at.push([EP[0],head,flt,0],[EP[1],head,flt,0]);if(bb)at.push([EP[2],'',bb,1],[EP[0],'',bb,1]);if(!at.length)at.push([EP[0],head,flt,0]);
 let d,err;
 for(let i=0;i<at.length;i++){const[ep,hd,fl,ab]=at[i];prog(30+i*12,'Consultando o Overpass (tentativa '+(i+1)+' de '+at.length+(ab?', modo rápido por região':'')+')…');
  try{const r=await http(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(mk(hd,fl,25))},35000);if(r.remark&&/timeout|error/i.test(r.remark)&&!(r.elements||[]).length)throw new Error('Overpass: '+r.remark);d=r;if(ab)approx=true;break}catch(e){err=e}}

 const out=[],ids=new Set(),keys=new Set(),ord=[...q.niches].sort((a,b)=>b.e.some(x=>x[2])-a.e.some(x=>x[2]));

async function run(){const cn=$('#co').value.trim(),c=CT.find(x=>nrm(x[0])==nrm(cn)),city=$('#ci').value.trim();
 if(!c)return toast('Escolha um país da lista.');if(!city)return toast('Informe a cidade.');if(!chosen.size)return toast('Selecione ao menos um nicho.');
 if(Date.now()-last<8000)return toast('Aguarde alguns segundos entre pesquisas para não sobrecarregar a fonte gratuita.');
 const niches=[...chosen].map(id=>{if(id.startsWith('x:')){const t=id.slice(2);return{id,label:t,g:'def',e:[['name',t]]}}const n=N.find(x=>x[0]==id);return{id,label:n[1].replace(/ \(.*/,''),g:n[2],e:n[3]}});
 const q={cc:c[1],countryName:c[0],region:$('#rg').value.trim(),city,niches,limit:+$('#lm').value,pres:$('#pr').value,phone:$('#ph').checked};
 const ck=JSON.stringify(['v2',q.cc,q.region,nrm(city),[...chosen].sort()]);$('#go').disabled=true;R=[];meta=null;paintRes();const t0=Date.now(),iv=setInterval(()=>{const e=$('#el');if(e)e.textContent='· '+Math.round((Date.now()-t0)/1000)+'s'},1000);
 try{let hit=S.cache[ck],items,approx,fromCache=false;
  if(hit&&Date.now()-hit.t<864e5){items=hit.items;approx=hit.approx;fromCache=true;prog(70,'Usando resultado em cache (menos de 24 h).')}
  else{last=Date.now();const r=await providers.osm.search(q,prog);items=r.items;approx=r.approx;if(items.length){S.cache[ck]={t:Date.now(),items,approx};const ks=Object.keys(S.cache);if(ks.length>4)delete S.cache[ks.sort((a,b)=>S.cache[a].t-S.cache[b].t)[0]]}}
  R=pick(items,q);meta={fromCache,approx,total:items.length,date:new Date().toLocaleString('pt-BR'),q};
  const cnt=s=>R.filter(x=>x.status==s).length;tab=q.pres=='com'?'com_site':['sem_site','inconclusivo','com_site'].find(s=>cnt(s))||'sem_site';
  S.h.unshift({date:meta.date,city,country:c[0],niches:niches.map(n=>n.label).join(', '),found:R.length,sem:cnt('sem_site'),com:cnt('com_site')});S.h=S.h.slice(0,50);persist();prog(100,'Pesquisa concluída.')
 }catch(e){const m=e.user||(e.code==429?'A fonte gratuita limitou as requisições. Aguarde alguns minutos e tente de novo.':e.code==504||e.code==503?'O serviço Overpass está sobrecarregado ou indisponível. Tente novamente em instantes.':e.name=='AbortError'?'A consulta demorou demais. Tente com menos nichos ou uma cidade menor.':'Não consegui acessar o Nominatim/Overpass. Se você vê o app dentro do Claude (pré-visualização), conexões externas são bloqueadas: baixe o arquivo e abra com duplo clique no Chrome, Edge ou Firefox. Detalhe técnico: '+(e.message||e));$('#prog').innerHTML=`<div class="note er">${esc(m)}</div>`}
 clearInterval(iv);$('#go').disabled=false;paintRes()}

function openD(id){const p=find(id);dm={id,ts:dm.ts};const m=p.msg||{style:S.cfg.style,channel:S.cfg.channel};
 $('#dr').innerHTML=`<div class=row style="justify-content:space-between"><h2 style="margin:0">${esc(p.name)}</h2><button class="btn sm" onclick="$('#dr').classList.remove('on')">Fechar</button></div><span class="bd ${p.status}">${ST[p.status]}</span>
 <dl style="margin-top:12px"><dt>Nicho<dd>${esc(p.niche)}<dt>Cidade<dd>${esc(p.city)}<dt>Endereço<dd>${esc(p.addr)||'não disponível'}<dt>Telefone<dd>${esc(p.phone)||'não disponível'}<dt>E-mail<dd>${esc(p.email)||'não disponível'}<dt>Site<dd>${p.site?`<a href="${esc(p.site)}" target=_blank rel=noopener>${esc(p.site)}</a>`:'não identificado'}<dt>Redes<dd>${p.social.length?esc(p.social.join(', ')):'não disponível'}<dt>Coordenadas<dd>${p.lat?p.lat.toFixed(5)+', '+p.lon.toFixed(5):'não disponível'}<dt>Fonte<dd>${esc(p.src)} · ${esc(p.date)}<dt>Mapa<dd><a href="${esc(p.map)}" target=_blank rel=noopener>Abrir na fonte</a></dl>
 <div class=row><select id=ds2 onchange="dGen()">${Object.keys(SN).map(k=>`<option value=${k} ${k==m.style?'selected':''}>${SN[k]}</option>`).join('')}</select><select id=dc2 onchange="dGen()">${Object.keys(CH).map(k=>`<option value=${k} ${k==m.channel?'selected':''}>${CH[k]}</option>`).join('')}</select><button class=btn onclick="dGen()">Regenerar</button></div>
 <input id=dsub placeholder="Assunto" style="margin-bottom:8px"><textarea id=dmsg></textarea>
 <div class=row style="margin-top:10px"><button class="btn pri" onclick="dCopy()">Copiar mensagem</button><button class=btn onclick="dSave()">Salvar prospecto e edição</button></div>
 ${S.p[id]?`<label for=df>Status no funil</label><select id=df onchange="setF('${esc(id)}',this.value)">${Object.keys(F).map(f=>`<option value=${f} ${f==p.funnel?'selected':''}>${F[f]}`).join('')}</select>`:''}<p class=mu>Revise a mensagem antes de enviar. O app não envia nada automaticamente.</p>`;
 $('#dr').classList.add('on');if(p.msg){$('#dsub').value=p.msg.subject||'';$('#dmsg').value=p.msg.body;dSub()}else dGen()}
function dSub(){$('#dsub').style.display=$('#dc2').value=='email'?'block':'none'}
function dGen(){const p=find(dm.id),g=gen(p,$('#ds2').value,$('#dc2').value);$('#dsub').value=g.subject;$('#dmsg').value=g.body;dSub()}
function dCur(){return{subject:$('#dsub').value,body:$('#dmsg').value,style:$('#ds2').value,channel:$('#dc2').value}}
function dCopy(){const p=ensure(find(dm.id)),m=dCur();p.msg=m;p.copied=true;if(p.funnel=='novo')p.funnel='preparada';cp((m.channel=='email'&&m.subject?'Assunto: '+m.subject+'\n\n':'')+m.body);persist();toast('Copiado. Prospecto salvo como “Mensagem preparada”.')}
function dSave(){const p=ensure(find(dm.id));p.msg=dCur();if(p.funnel=='novo')p.funnel='preparada';persist();toast('Prospecto e mensagem salvos.');openD(p.id)}
function saveTpl(){const v=$('#tt').value.trim();if(!v)return;S.tpl[$('#ts').value]=v;persist();toast('Modelo salvo.')}
function exportCsv(l){if(!l.length)return toast('Nada para exportar.');const H=['Empresa','Nicho','Cidade','Endereço','Telefone','E-mail','Site','Presença digital','Funil','Fonte','Data da consulta','Mapa','Latitude','Longitude'];
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=l.map(x=>[x.name,x.niche,x.city,x.addr,x.phone,x.email,x.site,ST[x.status],F[x.funnel],x.src,x.date,x.map,x.lat,x.lon].map(q).join(','));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[H.map(q).join(','),...rows].join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='prospectos.csv';a.click();toast('CSV exportado.')}
function exportSel(){const l=(cur=='search'?R:saved()).map(U);exportCsv(sel.size?l.filter(x=>sel.has(x.id)):l)}
go('home');
</script></body></html>
